name: Release

# HACS installs the GitHub releases of this repository. Start this workflow on main
# (Actions > Release > Run workflow) after raising "version" in manifest.json: it tags
# v<version> and publishes the release with the notes of that version from CHANGELOG.md.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from manifest.json
        id: version
        run: echo "version=$(jq -r .version custom_components/iw_erp_homeassistant/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## / { if (found) exit; found = ($2 == v) ; next }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section ## ${{ steps.version.outputs.version }}"; exit 1; }
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag exists already"; exit 1; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
